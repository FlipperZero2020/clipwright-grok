[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipwright"
version = "0.1.0"
description = "Clipwright GIF engine. clipwright-grok is the fork Grok Bot runs (ffmpeg + Pillow, no LLM)."
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
clipwright = "clipwright.cli:main"
clipwrightd = "clipwrightd.poll:main"
clipwright-ops = "clipwrightd.ops:main"

[tool.setuptools]
packages = ["clipwright", "clipwright.pipelines", "clipwrightd"]

[tool.setuptools.package-data]
clipwright = ["cookbook/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

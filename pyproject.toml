[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipwright"
version = "0.1.0"
description = "A $0-per-render, Telegram-driven GIF/video foundry (ffmpeg + Pillow, no LLM)."
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
clipwright = "clipwright.cli:main"
clipwrightd = "clipwrightd.poll:main"

[tool.setuptools]
packages = ["clipwright", "clipwright.pipelines", "clipwrightd"]

[tool.setuptools.package-data]
clipwright = ["cookbook/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
